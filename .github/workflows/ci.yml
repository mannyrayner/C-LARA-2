name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  picture-concurrency-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clara_concurrency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: clara_concurrency_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt "psycopg[binary]"
      - name: Real row-lock races with mocked picture providers
        working-directory: platform_server
        run: python manage.py test community_dictionary.tests.test_image_capacity --noinput

  staging-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate disabled staging bootstrap package without AWS
        run: |
          pip install cfn-lint==1.60.1
          python ops/community_deploy/package_staging.py --output "$RUNNER_TEMP/staging-review"
          cfn-lint --region ap-southeast-2 --template "$RUNNER_TEMP/staging-review/host.cfn.json" "$RUNNER_TEMP/staging-review/runtime.cfn.json"
          bash -n ops/community_deploy/staging_runtime/host-user-data.sh
          sh -n ops/community_deploy/staging_runtime/manage.sh ops/community_deploy/staging_runtime/services.sh
      - uses: actions/upload-artifact@v4
        with:
          name: disabled-staging-bootstrap-review
          path: ${{ runner.temp }}/staging-review/
          include-hidden-files: true
          retention-days: 14

  deployment-controller:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Disposable deployment and recovery tests
        run: python -m unittest discover -s ops/community_deploy/tests -v

  test:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt
      
      - name: Community dictionary workflow and access tests
        run: |
          . .venv/bin/activate
          cd platform_server
          python manage.py check
          python manage.py makemigrations --check --dry-run community_dictionary
          python manage.py test community_dictionary

      - name: Run tests + coverage
        run: |
          . .venv/bin/activate
          mkdir -p reports/${RUN_ID}
          coverage run -m pytest --junitxml=reports/${RUN_ID}/junit.xml
          coverage xml -o reports/${RUN_ID}/coverage.xml
          coverage html -d reports/${RUN_ID}/coverage_html

      - name: Summarize results (JSON)
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json, xml.etree.ElementTree as ET, os
          rid = os.environ["RUN_ID"]
          tree = ET.parse(f"reports/{rid}/junit.xml")
          root = tree.getroot()
          ts = root.attrib
          summary = {
              "run_id": rid,
              "tests": int(ts.get("tests", 0)),
              "failures": int(ts.get("failures", 0)),
              "errors": int(ts.get("errors", 0)),
              "skipped": int(ts.get("skipped", 0)),
              "time_s": float(ts.get("time", 0.0)),
          }
          out = f"reports/{rid}/summary.json"
          os.makedirs(f"reports/{rid}", exist_ok=True)
          with open(out, "w") as fh:
              fh.write(json.dumps(summary, indent=2))
          print("SUMMARY:", json.dumps(summary))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: reports/${{ github.run_id }}/
