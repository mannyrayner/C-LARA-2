name: Install Community Dictionaries on laptop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clara-laptop
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: [self-hosted, Windows, clara-laptop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the prepared release
        shell: powershell
        env:
          CLARA_PYTHON: ${{ vars.CLARA_PYTHON }}
          CLARA_CONTROLLER: ${{ vars.CLARA_CONTROLLER }}
          CLARA_CONFIG: ${{ vars.CLARA_CONFIG }}
        run: |
          & $env:CLARA_PYTHON -E $env:CLARA_CONTROLLER install --config $env:CLARA_CONFIG --request current_release.json --receipt receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laptop-receipt
          path: receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Ask for human acceptance
        shell: powershell
        run: |
          $r = Get-Content receipt.json -Raw | ConvertFrom-Json
          "Installed commit: $($r.commit). Open http://127.0.0.1:8000/community-dictionaries/ and check the change. If acceptable, run the 'Accept laptop and deploy AWS' workflow on main." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
