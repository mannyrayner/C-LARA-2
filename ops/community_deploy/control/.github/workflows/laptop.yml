name: Install Community Dictionaries on laptop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clara-laptop
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: [self-hosted, Windows, clara-laptop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Use cmd for the Python launcher so runner restarts do not depend on a
      # PowerShell session's execution policy. Keep controller checks unchanged.
      - name: Install the prepared release
        shell: cmd
        env:
          CLARA_PYTHON: ${{ vars.CLARA_PYTHON }}
          CLARA_CONTROLLER: ${{ vars.CLARA_CONTROLLER }}
          CLARA_CONFIG: ${{ vars.CLARA_CONFIG }}
        run: |
          "%CLARA_PYTHON%" -E "%CLARA_CONTROLLER%" install --config "%CLARA_CONFIG%" --request current_release.json --receipt receipt.json
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laptop-receipt
          path: receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Ask for human acceptance
        shell: cmd
        env:
          CLARA_PYTHON: ${{ vars.CLARA_PYTHON }}
        run: |
          "%CLARA_PYTHON%" -E -c "import json, os; from pathlib import Path; r = json.loads(Path('receipt.json').read_text(encoding='utf-8')); message = 'Installed commit: ' + r['commit'] + '. Open http://127.0.0.1:8000/community-dictionaries/ and check the change. If acceptable, run the Accept laptop and deploy AWS workflow on main.'; print(message, file=open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8'))"
          if errorlevel 1 exit /b %errorlevel%
