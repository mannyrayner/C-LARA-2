server {
    listen 80;
    server_name STAGING_HOSTNAME;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name STAGING_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/STAGING_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGING_HOSTNAME/privkey.pem;
    auth_basic "Private C-LARA staging";
    auth_basic_user_file /etc/nginx/clara-staging.htpasswd;
    client_max_body_size 200M;
    location /accounts/register/ { return 404; }
    location /static/ { alias /srv/C-LARA-2-staging/platform_server/staticfiles/; }
    location /media/ { alias /var/lib/clara-staging-media/; }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_read_timeout 600s;
        proxy_pass http://unix:/run/gunicorn-clara-staging/app.sock;
    }
}
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    location = /community-dictionaries/deployment-health/ {
        proxy_set_header Host STAGING_HOSTNAME;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/gunicorn-clara-staging/app.sock;
    }
    location / { return 404; }
}
