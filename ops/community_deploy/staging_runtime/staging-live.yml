name: Deploy and check bounded staging
on:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-session-request
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && github.ref_protected == true && github.event.issue.title == 'Deploy Community Dictionaries to staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.STAGING_REQUESTER_ROLE }}
          aws-region: ap-southeast-2
          role-duration-seconds: 900
      - name: Prepare trusted browser tools
        run: |
          python3 -m venv .tools
          .tools/bin/pip install -r requirements.txt
          .tools/bin/python -m playwright install --with-deps chromium
      - name: Request, verify and stop staging
        env:
          STAGING_ALIAS: ${{ vars.STAGING_LIVE_ALIAS }}
          STAGING_HOSTNAME: ${{ vars.STAGING_HOSTNAME }}
          STAGING_SECRET: ${{ vars.STAGING_CREDENTIAL_SECRET }}
          STAGING_BUCKET: ${{ vars.STAGING_STATE_BUCKET }}
          STAGING_KEEP_OPEN: ${{ vars.STAGING_KEEP_OPEN }}
        run: |
          if [ "$STAGING_KEEP_OPEN" = true ]; then set -- --keep-open; else set --; fi
          .tools/bin/python staging_job.py --alias "$STAGING_ALIAS" --region ap-southeast-2 --hostname "$STAGING_HOSTNAME" --secret-arn "$STAGING_SECRET" --fixture-bucket "$STAGING_BUCKET" --report staging-report.json "$@"
      - name: Retain content-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-report.json
            browser-report.json
          if-no-files-found: warn
          retention-days: 30
