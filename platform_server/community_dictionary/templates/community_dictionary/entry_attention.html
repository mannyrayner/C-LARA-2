{% load i18n %}
<details class="panel"><summary>{% translate "Flag a problem" %}{% if attention_count %} ({{ attention_count }}){% endif %}</summary><form method="post" action="{% url 'community_dictionary:flag' dictionary.pk entry.pk %}">{% csrf_token %}<input type="hidden" name="submission_id" value="{{ submission_id }}"><label for="attention-reason">{% translate "What should someone check? (optional)" %}</label><textarea id="attention-reason" name="reason" maxlength="1000" rows="2"></textarea><button>{% translate "Flag for attention" %}</button></form><a href="{% url 'community_dictionary:attention' dictionary.pk %}">{% translate "Dictionary attention list" %}</a></details>
