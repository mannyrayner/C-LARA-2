<details class="panel"><summary>Activity history</summary><ul class="history">{% for item in events %}<li>{{ item.created_at|date:'j M, H:i' }} · {{ item.actor.username }} · {{ item.action }}{% if item.detail %}: {{ item.detail }}{% endif %}</li>{% endfor %}</ul></details>
{% if editor and not dictionary.personal %}<form method="post" action="{% url 'community_dictionary:remove-entry' dictionary.pk entry.pk %}" data-confirm="Archive this entry and return its contributions to their contributors' private collections?">{% csrf_token %}<button class="quiet danger">Archive this entry and return contributions</button></form>{% endif %}
