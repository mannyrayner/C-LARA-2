{% if capture_origin %}<p class="badge">{% if language_check %}Language checked by {{ language_check.checked_by.username }}{% else %}Meaning confirmed by contributor · language not yet checked{% endif %}</p>{% endif %}
{% if editor and entry.current_text_id %}<form method="post" action="{% url 'community_dictionary:language-checked' dictionary.pk entry.pk %}">{% csrf_token %}<input type="hidden" name="text_id" value="{{ entry.current_text_id }}"><input type="hidden" name="meaning_id" value="{{ entry.current_meaning_id|default:'' }}"><p><button class="secondary">Mark wording checked and resolve reports</button></p></form>{% endif %}
