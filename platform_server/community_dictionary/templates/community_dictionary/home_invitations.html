{% load i18n %}<section class="panel"><h2>{% translate "You’re invited" %}</h2>{% for invitation in invitations %}<form method="post" action="{% url 'community_dictionary:join' invitation.dictionary_id %}" class="inline-form">{% csrf_token %}<span>{{ invitation.dictionary.name }} · {{ invitation.dictionary.language }}{% if invitation.dictionary.hidden %} · {% translate "Hidden" %}{% endif %}</span><button>{% translate "Join dictionary" %}</button></form>{% endfor %}</section>
