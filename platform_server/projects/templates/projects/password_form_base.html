{% extends "projects/base.html" %}
{% block extra_head %}
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  .password-page { max-width: 36rem; }
  .password-page label { display: block; margin-bottom: .4rem; }
  .password-page input, .password-page select { box-sizing: border-box; width: 100%; max-width: 26rem; padding: .65rem; font: inherit; }
  .password-page .helptext { display: block; margin-top: .5rem; }
  .password-page .errorlist { color: #9d1023; }
  .password-page button { min-height: 44px; font: inherit; }
  .password-page .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem; }
  @media (max-width: 600px) { body { margin: 1rem; } nav { line-height: 2; } }
</style>
{% endblock %}
